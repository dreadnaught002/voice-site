<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@100..900&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
html, body {
	height: 100%;
	margin: 0;
	}
	
body {
	display: flex;
	flex-flow: column;
	background: linear-gradient(to top,
		rgb(238,175,97),
		rgb(251,144,98),
		rgb(238,93,108),
		rgb(206,73,147),
		rgb(106,13,131)
		);
	}

main {
	display: flex;
	flex-flow: column;
	flex: 1;
	width: 100%;
	max-width: 800px;
	margin: 0 auto;
	background-color: rgb(250,250,255);
	filter: drop-shadow(10px 10px 10px rgba(0,0,0,0.2));
	
	opacity: 0;
	transition: opacity 0.5s ease;
	}

.reveal {
	opacity: 1;
	}

.headline {
	width: fit-content;
	margin: 0 auto 100px auto;
	}

.subtitle {
	display: flex;
	align-items: center;
	margin-top: -6px;
	}

.sub-line {
	flex: 1;
	height: 1px;
	background-color: #781178; 
	margin-top: 7px;
	}

.contact { margin-left: 35px; }

.footnote {
	width: fit-content;
	margin: 0 auto 16px auto;
	font-size: 0.9rem;
	}



.jost, .jost-bold {
	font-family: "jost", sans-serif;
	font-optical-sizing: auto;
	font-style: normal;
	}

.jost { font-weight: 400; }
.jost-bold { font-weight: 600; }

.marker {
	font-family: "Permanent Marker", cursive;
	font-weight: 400;
	font-style: normal;
	color: #781178;
	line-height: 1;
	transform: rotate(-1deg);
	}




h1 {
	margin-top: 50px;
	margin-bottom: 0;
	font-size: 3.25rem;
	
	color: #fff;
	font-weight: bold;
	-webkit-text-stroke: 6px #9c179d;
	paint-order: stroke fill; 
	}

h2 {
	margin: 0;
	font-size: 2rem;
	}

h3 {
	margin: 0;
	font-size: 1.5rem;
	}

p {
	margin: 0;
	font-size: 1.1rem;
	}

audio {
	width: 45%;
	margin: 0 auto;
	}

</style>
</head>

<body>

<main>
<div class="headline" style="text-align: center;">
	<h1 class="jost-bold">STEVEN SCHNEIDER</h1>
	<div class="subtitle">
		<div class="sub-line"></div>
		<h2 class="marker" style="padding: 0 1rem;">Voice Actor</h2>
		<div class="sub-line"></div>
	</div>
</div>

<p>EMBED GOES HERE</p>

<audio controls>
    <source src="reel001.mp3" type="audio/mpeg">
</audio>

<div style="margin-top: auto;">
	<div class="contact" style="margin-bottom: 50px;">
		<h3 class="jost-bold">CONTACT:</h3>
		<p class="jost">
		Email: <a href="" target="_blank">steven@steven.steve</a><br />
		Twitter: <a href="https://x.com/Coconut_Steve" target="_blank">@Coconut_Steve</a><br />
		Discord: <a href="https://discord.com/users/195729493493547018" target="_blank">@CoconutSteve</a></p>
	</div>

	<p class="footnote jost" style="text-align: center;">
	© 2026</p>
</div>
</main>

</body>

<script>
const main = document.querySelector("main");
setTimeout(() => {
	main.classList.add('reveal')
	}, 500);
</script>
</html>
